<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verification Code</title>

    <link rel="stylesheet" href="VerificationCode.css">
</head>

<body>

    <div class="verification-container">

        <a href="EmailVerification.html" class="back-button">←</a>

        <img src="ptc_logo.png" alt="School Logo" class="logo">

        <h1>Verification Code</h1>

        <p id="recovery-status" role="status" aria-live="polite">Checking recovery request status...</p>
        <p>The MIS Admin must approve your request. After approval, the code must be provided to you directly by the verified MIS Admin.</p>

        <form>

            <div class="code-container">

                <input type="text" maxlength="1" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]" aria-label="Digit 1" disabled required>
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 2" disabled required>
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 3" disabled required>
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 4" disabled required>
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 5" disabled required>
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 6" disabled required>

            </div>

            <button type="submit" class="confirm-button">
                Confirm
            </button>

        </form>

    </div>

    <script src="app.js"></script>
</body>
</html>

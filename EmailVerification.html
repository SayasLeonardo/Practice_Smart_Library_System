<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email Verification</title>

    <link rel="stylesheet" href="EmailVerification.css">

</head>

<body>

    <div class="verification-container">

        <a href="LogIn.html" class="back-button">←</a>

        <img src="ptc_logo.png" alt="School Logo" class="logo">

        <h1>Forgot Password</h1>
        <p>Submit your registered Librarian email. The MIS Admin will review your request; no email will be sent.</p>

        <form>

            <div class="input-group">
                <label for="email">Institutional Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your institutional email"
                    autocomplete="off"
                    required
                >
            </div>

            <button type="submit" class="send-button">
                Send
            </button>

        </form>

    </div>

    <script src="app.js"></script>
</body>
</html>
